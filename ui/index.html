<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f7f7f5" />
    <title>FreeTV · 电视直播</title>
  </head>
  <body>
    <header>
      <div>
        <div class="row left">
          <div class="brand"><i class="logo"></i>FreeTV</div>
          <nav>
            <button id="home" class="active">电视直播</button
            ><button id="radioNav">全球电台</button
            ><button id="favorites">我的收藏</button>
          </nav>
        </div>
        <label class="search"
          >⌕
          <input id="search" aria-label="搜索频道" placeholder="搜索频道或地区"
        /></label>
      </div>
    </header>
    <main id="tvPage">
      <div class="between headline">
        <h1>电视直播</h1>
        <button class="textbtn" id="manage">设置</button>
      </div>
      <div class="watch-tools">
        <div
          id="layouts"
          class="layout-picker"
          role="group"
          aria-label="观看布局"
        >
          <button data-layout="1" aria-pressed="true">单画面</button>
          <button data-layout="2" aria-pressed="false">双画面</button>
          <button data-layout="4" aria-pressed="false">四宫格</button>
        </div>
        <div class="view-actions">
          <button class="outline" id="pip" disabled>画中画</button>
          <button class="outline" id="fullscreen">全屏</button>
        </div>
      </div>
      <button class="outline" id="restorePip" hidden>返回直播大厅</button>
      <div class="stage">
        <div id="wall" class="wall" data-layout="1">
          <button id="exitFullscreen" hidden>退出全屏</button>
        </div>
        <template id="tileTemplate">
          <section class="screen">
            <video playsinline controls></video>
            <button class="screen-tag" aria-pressed="false"></button>
            <div class="cover">
              <span class="stamp"></span>
              <h2></h2>
              <button class="screen-play">播放直播</button>
            </div>
          </section>
        </template>
        <aside class="chanbox">
          <div class="between">
            <h2 id="listTitle">频道选择</h2>
            <span id="count" class="counter"></span>
          </div>
          <div class="tabs" id="tabs"></div>
          <label id="countryFilter" class="country-filter" hidden>
            国家或地区
            <select id="tvCountry"></select>
          </label>
          <div class="chanlist" id="channels"></div>
        </aside>
      </div>
      <div class="below">
        <div class="subinfo">
          <b id="now">选择频道</b
          ><small class="status" id="status" role="status"></small>
        </div>
        <div class="chipline">
          <button class="outline" id="videoToggle" disabled>播放</button
          ><button class="outline" id="routes" disabled>线路</button
          ><button class="outline" id="save" disabled>☆ 收藏</button>
        </div>
      </div>
      <footer>
        <button id="notices">FreeTV · 开源许可</button
        ><span>频道来源　Free-TV / best-fan</span>
      </footer>
    </main>
    <main id="radioPage" hidden>
      <section class="between headline">
        <h1>全球电台</h1>
        <div class="view-actions">
          <button class="textbtn" data-act="proxy">网络代理</button>
          <button class="outline" id="radioFavs">电台收藏</button>
        </div>
      </section>
      <section class="radio-tuner" aria-label="电台播放器">
        <div>
          <span id="radioStatus" role="status">选择电台开始收听</span>
          <h2 id="radioName">尚未选台</h2>
          <small id="radioMeta"></small>
        </div>
        <div class="row">
          <button id="radioToggle" class="outline" disabled>播放</button
          ><button id="radioStop" class="outline" disabled>停止</button>
        </div>
        <audio id="radioAudio" playsinline></audio>
      </section>
      <form id="radioFilters">
        <input
          name="name"
          type="search"
          placeholder="搜索电台名称"
          aria-label="电台名称"
        />
        <input
          name="country"
          maxlength="2"
          placeholder="国家或地区代码，如 CN"
          aria-label="国家或地区代码"
        />
        <input
          name="language"
          placeholder="语言，如 english"
          aria-label="语言"
        />
        <input name="tag" placeholder="类型，如 jazz" aria-label="类型" />
        <button class="outline" type="submit">搜索</button>
      </form>
      <section class="section">
        <h2 id="radioListTitle">热门电台</h2>
        <p id="radioMessage" role="status"></p>
        <div id="radioList"></div>
        <button id="radioMore" class="outline" hidden>更多电台</button>
      </section>
      <footer>电台目录由 Radio Browser 提供</footer>
    </main>
    <template id="proxyTemplate">
      <form id="proxyForm" class="proxy-form">
        <h2>网络代理</h2>
        <label
          >代理地址<input
            name="address"
            type="text"
            autocomplete="off"
            autocapitalize="none"
            spellcheck="false"
            placeholder="socks5h://127.0.0.1:1080"
        /></label>
        <small
          >支持 HTTP、HTTPS、SOCKS5 和 SOCKS5H。SOCKS5H
          由代理解析域名。仅支持免认证代理。</small
        >
        <fieldset>
          <legend>通过代理连接</legend>
          <label
            ><input type="checkbox" name="tvList" />电视 · 同步频道列表</label
          >
          <label
            ><input type="checkbox" name="tvPlay" />电视 ·
            直播播放与线路检测</label
          >
          <label
            ><input type="checkbox" name="radioList" />电台 ·
            浏览与搜索目录</label
          >
          <label
            ><input type="checkbox" name="radioPlay" />电台 · 收听直播</label
          >
        </fieldset>
        <small
          >未勾选的项目直连。保存后对新请求生效，正在播放的频道可重新选台。</small
        >
        <p class="error" role="status"></p>
        <button class="outline" type="submit">保存设置</button>
      </form>
    </template>
    <dialog class="sheet" id="dialog">
      <div id="dialogBody" class="modalScroll"></div>
      <button class="outline" id="close">关闭</button>
    </dialog>
    <script type="module" src="/main.js"></script>
  </body>
</html>
