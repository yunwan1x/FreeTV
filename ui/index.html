<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f7f7f5" />
    <title>FreeTV · 电视直播</title>
  </head>
  <body>
    <header>
      <div>
        <div class="row left">
          <div class="brand"><i class="logo"></i>FreeTV</div>
          <nav>
            <button id="home" class="active">电视直播</button
            ><button id="vodNav">点播</button
            ><button id="radioNav">全球电台</button
            ><button id="favorites">我的收藏</button>
          </nav>
        </div>
        <div class="row header-actions">
          <label class="search"
            >⌕
            <input id="search" aria-label="搜索频道" placeholder="搜索频道或地区"
          /></label>
          <button class="outline" id="manage" aria-haspopup="dialog">设置</button>
        </div>
      </div>
    </header>
    <main id="tvPage">
      <div class="between headline">
        <h1>电视直播</h1>
      </div>
      <div class="watch-tools">
        <div
          id="layouts"
          class="layout-picker"
          role="group"
          aria-label="观看布局"
        >
          <button data-layout="1" aria-pressed="true">单画面</button>
          <button data-layout="2" aria-pressed="false">双画面</button>
          <button data-layout="4" aria-pressed="false">四宫格</button>
        </div>
        <div class="view-actions">
          <button class="outline" id="pip" disabled>画中画</button>
          <button class="outline" id="fullscreen">全屏</button>
        </div>
      </div>
      <button class="outline" id="restorePip" hidden>返回直播大厅</button>
      <div class="stage">
        <div id="wall" class="wall" data-layout="1">
          <button id="exitFullscreen" hidden>退出全屏</button>
        </div>
        <template id="tileTemplate">
          <section class="screen">
            <video playsinline controls></video>
            <button class="screen-tag" aria-pressed="false"></button>
            <div class="cover">
              <span class="stamp"></span>
              <h2></h2>
              <button class="screen-play">播放直播</button>
            </div>
          </section>
        </template>
        <aside class="chanbox">
          <div class="between">
            <h2 id="listTitle">频道选择</h2>
            <span id="count" class="counter"></span>
          </div>
          <div class="tabs" id="tabs"></div>
          <div id="countryFilter" class="country-filter" hidden>
            <label for="tvCountry">国家或地区</label>
            <div class="country-combo">
              <input
                id="tvCountry"
                aria-label="筛选电视频道国家或地区"
                placeholder="全部国家和地区"
                autocomplete="off"
                spellcheck="false"
              />
              <button type="button" aria-label="展开电视国家和地区列表">
                ⌄
              </button>
            </div>
          </div>
          <div class="chanlist" id="channels"></div>
        </aside>
      </div>
      <div class="below">
        <div class="subinfo">
          <b id="now">选择频道</b
          ><small class="status" id="status" role="status"></small>
        </div>
        <div class="chipline">
          <button class="outline" id="videoToggle" disabled>播放</button
          ><button class="outline" id="routes" disabled>线路</button
          ><button class="outline" id="save" disabled>☆ 收藏</button>
        </div>
      </div>
      <footer>
        <span>频道来源　Free-TV / best-fan</span>
      </footer>
    </main>
    <main id="vodPage" hidden>
      <section id="vodBrowse">
        <div class="between headline">
          <h1>点播</h1>
        </div>
        <form id="vodSearchForm">
          <input
            type="search"
            id="vodQuery"
            aria-label="搜索视频名称"
            placeholder="搜索视频名称"
          /><button class="vod-primary">搜索</button>
        </form>
        <button id="vodResume" hidden></button>
        <div class="between vod-list-heading">
          <h2 id="vodListTitle">分类浏览</h2>
          <div class="vod-buttons">
            <button class="outline" id="vodBookmarks">我的片单</button
            ><button class="outline" id="vodRefresh">刷新</button>
          </div>
        </div>
        <label class="vod-filters">搜索范围 <select id="vodFilters" aria-label="筛选点播来源"></select></label>
        <p id="vodMessage" role="status"></p>
        <div class="vod-cards" id="vodCards"></div>
        <button class="outline" id="vodMore" hidden>更多影片</button>
      </section>
      <section id="vodWatch" hidden>
        <div class="between headline">
          <button class="outline" id="vodBack">‹ 返回片库</button>
        </div>
        <div class="vod-watch-grid">
          <section>
            <video
              id="vodVideo"
              controls
              playsinline
              preload="metadata"
            ></video>
            <div class="between vod-list-heading">
              <h1 id="vodTitle"></h1>
              <button class="outline" id="vodSave">收藏</button>
            </div>
            <p id="vodPlayback" role="status"></p>
          </section>
          <aside class="vod-panel">
            <h2>播放线路</h2>
            <label>影片来源<select id="vodProvider"></select></label
            ><label>线路<select id="vodLine"></select></label>
            <div class="between vod-list-heading">
              <h2>选集</h2>
              <small id="vodEpCount"></small>
            </div>
            <div class="vod-episodes" id="vodEpisodes"></div>
            <button class="outline" id="vodRetry">重新播放</button>
          </aside>
        </div>
      </section>
    </main>
    <main id="radioPage" hidden>
      <section class="between headline">
        <h1>全球电台</h1>
        <div class="view-actions">
          <button class="outline" id="radioFavs">电台收藏</button>
        </div>
      </section>
      <section class="radio-tuner" aria-label="电台播放器">
        <div>
          <span id="radioStatus" role="status">选择电台开始收听</span>
          <h2 id="radioName">尚未选台</h2>
          <small id="radioMeta"></small>
        </div>
        <div class="row">
          <button id="radioToggle" class="outline" disabled>播放</button
          ><button id="radioStop" class="outline" disabled>停止</button>
        </div>
        <audio id="radioAudio" playsinline></audio>
      </section>
      <form id="radioFilters">
        <input
          name="name"
          type="search"
          placeholder="搜索电台名称"
          aria-label="电台名称"
        />
        <div class="country-combo">
          <input
            id="radioCountry"
            placeholder="全部国家和地区"
            aria-label="筛选电台国家或地区"
            autocomplete="off"
            spellcheck="false"
          />
          <button type="button" aria-label="展开电台国家和地区列表">⌄</button>
        </div>
        <input
          name="language"
          placeholder="语言，如 english"
          aria-label="语言"
        />
        <input name="tag" placeholder="类型，如 jazz" aria-label="类型" />
        <button class="outline" type="submit">搜索</button>
      </form>
      <section class="section">
        <h2 id="radioListTitle">热门电台</h2>
        <p id="radioMessage" role="status"></p>
        <div id="radioList"></div>
        <button id="radioMore" class="outline" hidden>更多电台</button>
      </section>
      <footer>电台目录由 Radio Browser 提供</footer>
    </main>
    <template id="proxyTemplate">
      <form id="proxyForm" class="proxy-form">
        <h2>网络代理</h2>
        <label
          >连接方式<select name="mode">
            <option value="system">系统默认</option>
            <option value="custom">自定义代理规则</option>
          </select></label
        >
        <label
          >代理地址<input
            name="address"
            type="text"
            autocomplete="off"
            autocapitalize="none"
            spellcheck="false"
            placeholder="socks5h://127.0.0.1:1080"
        /></label>
        <label
          >代理用户名（可选）<input
            name="username"
            autocomplete="off"
            autocapitalize="none"
            spellcheck="false"
        /></label>
        <label
          >代理密码<input
            name="password"
            type="password"
            autocomplete="new-password"
        /></label>
        <small
          >支持 HTTP、HTTPS、SOCKS5 和 SOCKS5H。SOCKS5H
          由代理解析域名。用户名和密码以明文保存在本机配置文件中。</small
        >
        <fieldset>
          <legend>通过代理连接</legend>
          <label
            ><input type="checkbox" name="tvList" />电视 · 同步频道列表</label
          >
          <label
            ><input type="checkbox" name="tvPlay" />电视 ·
            直播播放与线路检测</label
          >
          <label
            ><input type="checkbox" name="radioList" />电台 ·
            浏览与搜索目录</label
          >
          <label
            ><input type="checkbox" name="radioPlay" />电台 · 收听直播</label
          ><label
            ><input type="checkbox" name="vodList" />点播 ·
            订阅、搜索与封面</label
          ><label
            ><input type="checkbox" name="vodPlay" />点播 · 媒体播放</label
          >
        </fieldset>
        <small
          >未勾选的项目直连。保存后对新请求生效，正在播放的频道可重新选台。</small
        >
        <p class="error" role="status"></p>
        <button class="outline" type="submit">保存设置</button>
      </form>
    </template>
    <dialog class="sheet" id="dialog">
      <div id="settingsNav" hidden>
        <h2>设置</h2>
        <div role="group" aria-label="设置分类" class="settings-tabs">
          <button class="outline" data-act="tvSettings">电视频道</button>
          <button class="outline" data-act="vodSettings">点播来源</button>
          <button class="outline" data-act="proxy">网络代理</button>
          <button class="outline" id="notices">开源许可</button>
        </div>
      </div>
      <div class="modalScroll">
        <div id="dialogBody"></div>
        <section id="vodSettings" class="vod-panel" hidden>
          <div class="between">
            <h2>点播源订阅</h2>
            <button class="outline" id="vodSyncAll">同步全部</button>
          </div>
          <label class="auto-sync"
            ><input
              type="checkbox"
              id="vodAuto"
            />打开点播时自动发现新源，每天更新订阅</label
          >
          <p>首次打开会读取内置点播源集合，新源自动加入搜索。可在下方关闭单个来源。</p>
          <div id="vodSources"></div>
          <div id="vodProbeHost"></div>
          <form id="vodAddForm">
            <label for="vodSubUrl">添加在线订阅</label>
            <div class="vod-import">
              <input
                id="vodSubUrl"
                type="url"
                required
                placeholder="https://…/sources.json"
              /><button class="outline">添加</button>
            </div>
            <small
              >支持 LibreTV、LunaTV、OuonnkiTV 和 TVBox JSON 采集接口。</small
            >
            <p role="status" id="vodImportMsg"></p>
          </form>
        </section>
      </div>
      <button class="outline" id="close">关闭</button>
    </dialog>
    <script type="module" src="/main.js"></script>
  </body>
</html>
