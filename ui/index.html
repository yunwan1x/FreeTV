<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f7f7f5" />
    <title>FreeTV · 电视直播</title>
  </head>
  <body>
    <header>
      <div>
        <div class="row left">
          <div class="brand"><i class="logo"></i>FreeTV</div>
          <nav>
            <button id="home" class="active">电视直播</button
            ><button id="schedule">节目单</button
            ><button id="favorites">我的收藏</button>
          </nav>
        </div>
        <label class="search"
          >⌕
          <input id="search" aria-label="搜索频道" placeholder="搜索频道或地区"
        /></label>
      </div>
    </header>
    <main>
      <div class="between headline">
        <h1>电视直播</h1>
        <button class="textbtn" id="manage">频道订阅</button>
      </div>
      <div class="stage">
        <section class="player">
          <video id="video" playsinline controls></video>
          <div class="cover" id="cover">
            <span class="stamp" id="station">FreeTV</span>
            <h2 id="title">正在载入频道</h2>
            <button id="play" disabled>播放直播</button>
          </div>
        </section>
        <aside class="chanbox">
          <div class="between">
            <h2 id="listTitle">频道选择</h2>
            <span id="count" class="counter"></span>
          </div>
          <div class="tabs" id="tabs"></div>
          <div class="chanlist" id="channels"></div>
        </aside>
      </div>
      <div class="below">
        <div class="subinfo">
          <b id="now">选择频道</b
          ><small class="status" id="status" role="status"></small>
        </div>
        <div class="chipline">
          <button class="outline" id="routes" disabled>线路</button
          ><button class="outline" id="save" disabled>☆ 收藏</button>
        </div>
      </div>
      <section class="section" id="guide">
        <div class="between">
          <h2>节目单</h2>
          <span class="meta" id="guideName"></span>
        </div>
        <div class="guide" id="shows"></div>
      </section>
      <section class="section">
        <h2>快速选台</h2>
        <div class="recs" id="quick"></div>
      </section>
      <footer>
        <button id="notices">FreeTV · 开源许可</button
        ><span>频道来源　Free-TV / best-fan</span>
      </footer>
    </main>
    <dialog class="sheet" id="dialog">
      <div id="dialogBody" class="modalScroll"></div>
      <button class="outline" id="close">关闭</button>
    </dialog>
    <script type="module" src="/main.js"></script>
  </body>
</html>
