[package]
name = "freetv"
version = "0.1.0"
edition = "2021"
default-run = "freetv"

[lib]
name = "freetv_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
freetv-core = { path = "../core" }
tauri = { version = "2", features = [] }
reqwest = { version = "0.12", default-features = false }
tokio = { version = "1", features = ["sync", "time"] }
